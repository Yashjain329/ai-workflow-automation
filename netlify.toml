[build]
  publish = "frontend"
  command = "# Static site - no build step required"

# Proxy API calls to the backend service
# Replace YOUR_BACKEND_URL with your actual deployed backend URL (e.g., Railway, Render, Fly.io)
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_URL/api/:splat"
  status = 200
  force = true

# Proxy WebSocket connections
[[redirects]]
  from = "/ws"
  to = "wss://YOUR_BACKEND_URL/ws"
  status = 101
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
