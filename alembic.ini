[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the footer.
# If left empty, localtime will be used.
# timezone =

# max length of characters to apply to the
# "caveat" block about removing autogenerated diffs.
# max_length_of_caveat = 80

# version path separator; As mentioned above, this is the string that will
# separate the version location from the version id, which defaults to "/".
# version_path_source = 
# version_loc_sep = |

# The output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname